<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A visual field guide to peaceful places and wildlife in the great outdoors.">
    <title>Outside, Slowly | An Outdoor Field Guide</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">A little field guide</p>
        <h1>Outside, Slowly</h1>
        <p class="introduction">Take a breath, follow the trail, and discover nine quiet corners of the natural world.</p>
        <a class="skip-link" href="#places">Skip to the field guide</a>
    </header>

    <main id="places">
        <h2>Nine places to pause</h2>
        <div class="gallery">
            <figure>
                <img src="images/mountain-lake.jpg" alt="A still alpine lake reflecting a range of green mountains beneath a cloudy sky">
                <figcaption>
                    <h3>Mirror Lake</h3>
                    <p>At first light, the water holds the mountains as if the day has not yet begun.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/forest.jpg" alt="Sunlight filtering through the tall trunks and leafy canopy of a green forest">
                <figcaption>
                    <h3>Green Cathedral</h3>
                    <p>Follow the cool shade beneath a canopy alive with birdsong and soft rustling leaves.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/alpine-peak.jpg" alt="A dramatic snow-streaked mountain peak rising above a rugged alpine range">
                <figcaption>
                    <h3>High Country</h3>
                    <p>Above the tree line, rocky ridges open onto wide views and crisp mountain air.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/deer.jpg" alt="A wild deer standing among trees and dappled forest light">
                <figcaption>
                    <h3>Quiet Visitor</h3>
                    <p>Move gently through the woods and you may spot a deer pausing between the trees.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/wildflower-meadow.jpg" alt="Warm evening sunlight spreading across a field of wild grasses and flowers">
                <figcaption>
                    <h3>Golden Meadow</h3>
                    <p>As the sun lowers, grasses turn gold and the field settles into a slower rhythm.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/coastal-cliffs.jpg" alt="A rugged green coastline meeting the open blue sea">
                <figcaption>
                    <h3>Edge of the Sea</h3>
                    <p>Stand back from the cliff edge and watch the tide draw bright lines along the coast.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/desert-dunes.jpg" alt="Softly curved sand dunes shaped by wind beneath an open sky">
                <figcaption>
                    <h3>Wind-Written Dunes</h3>
                    <p>Each ridge carries a new pattern, drawn and redrawn by the desert wind.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/mountain-trail.jpg" alt="A winding path leading through a mountain valley toward distant peaks">
                <figcaption>
                    <h3>The Long Way</h3>
                    <p>A winding trail is an invitation to notice the small details along the way.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/forest-path.jpg" alt="A peaceful woodland path surrounded by leafy trees">
                <figcaption>
                    <h3>Fernwood Path</h3>
                    <p>Take the quieter path and let the dappled light set an unhurried pace.</p>
                </figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>Leave only footprints; take home a little more wonder.</p>
    </footer>
</body>
</html>
